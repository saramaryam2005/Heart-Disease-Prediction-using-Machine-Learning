<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ML API</title>
    <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
 <link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
 <link href='https://fonts.googleapis.com/css?family=Hind:300' rel='stylesheet' type='text/css'>
 <link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>


</head>
<body>
    <div class="login">
        <h1>Hear Disease Prediction</h1>
         <!-- Main Input For Recieving Query to our ML-->
        <form action="{{ url_for('predict') }}" method="POST">
        
          <input type="text" name="male" placeholder="write 0 for female , 1 for male" required="required" /><br>
          <input type="text" name="age" placeholder="age" required="required" /><br>
          <input type="text" name="currentSmoker" placeholder="write 1 if smokes otherwise 0" required="required" /><br>
          <input type="text" name="cigsPerDay" placeholder ="cigarette per day" required="required" /><br>
          <input type="text" name="BPMeds"  placeholder ="Bp medicines , write 1 for yes , 0 for no"  required="required" /><br>
          <input type="text" name=" prevalentStroke" placeholder ="write 1 if any stroke otherwise 0" required="required" /><br>
          <input type="text" name="prevalentHyp"placeholder = "Prevalent Hypertension, write 1 if yes otherwise 0" required="required" /><br>
          <input type="text"name="diabetes" placeholder ="write 1 for diabetic patient otherwise 0" required="required" /><br>
          <input type="text"name="totChol"  placeholder ="total cholestrol level" required="required" /><br>
          <input type="text"name="sysBP" placeholder ="systolic BP" required="required" /><br>
          <input type="text"name="diaBP"  placeholder ="Diastolic BP" required="required" /><br>
          <input type="text"name="BMI" placeholder ="BMI" required="required" /><br>
          <input type="text"name="heartRate" placeholder ="heartRat" required="required" /><br>
          <input type="text"name="glucose" placeholder="glucose level" required="required" /><br>
          <button type ="submit" class="btn btn-primary btn-block btn-large"> Predict </button>
        </form>
        <br>
        <br>
    </div>
    {{prediction_text}}

</body>
</html>
